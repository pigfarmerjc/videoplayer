# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Memory settings for optimal compilation speed on Windows.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# AndroidX enables standard Jetpack namespaces
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Enable non-transitive R class namespacing for cleaner resource loading
android.nonTransitiveRClass=true

# Disable path check for non-ASCII characters
android.overridePathCheck=true

# Force Gradle to build using the downloaded JDK 17
org.gradle.java.home=C:\\Users\\pigfa\\.gradle\\jdks\\eclipse_adoptium-17-amd64-windows.2
